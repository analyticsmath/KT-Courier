name: One-time merged branch consolidation

on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidate-branches.yml]

permissions:
  contents: write

concurrency:
  group: one-time-branch-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify inclusion and atomically delete only reviewed branch heads
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (process.env.GITHUB_REPOSITORY !== 'analyticsmath/KT-Courier' || process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Unexpected repository or branch.');
          const main = process.env.GITHUB_SHA;
          const expected = new Map([
            ['codex/fix-dispatch-readiness', git('rev-parse', `${main}^2`)],
          ]);
          const heads = git('ls-remote', '--heads', 'origin').split('\n').map(line => {
            const [sha, ref] = line.split(/\s+/); return { sha, branch: ref.replace(/^refs\/heads\//, '') };
          });
          if (heads.find(head => head.branch === 'main')?.sha !== main) throw new Error('Main changed; inspect before retrying.');
          const deletions = heads.filter(head => head.branch !== 'main');
          for (const { sha, branch } of deletions) {
            if (expected.get(branch) !== sha) throw new Error(`Unreviewed or changed branch: ${branch}`);
            git('merge-base', '--is-ancestor', sha, main);
            console.log(`Verified included in main: ${branch} ${sha}`);
          }
          if (deletions.length) git('push', '--atomic', ...deletions.map(({ sha, branch }) => `--force-with-lease=refs/heads/${branch}:${sha}`), 'origin', ...deletions.map(({ branch }) => `:refs/heads/${branch}`));
          const remaining = git('ls-remote', '--heads', 'origin').split('\n');
          if (remaining.length !== 1 || !remaining[0].endsWith('\trefs/heads/main')) throw new Error('Branch cleanup verification failed.');
          console.log('Verified only main remains.');
          NODE
      - name: Remove completed one-time cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/consolidate-branches.yml
          git commit -m 'Remove completed one-time branch consolidation workflow'
          git push origin HEAD:refs/heads/main
