name: Client security lockfile recovery
on:
  push:
    branches: [feat/client-platform-requirements]
    paths: [.github/workflows/client-security-lockfile.yml]
permissions:
  contents: write
concurrency:
  group: client-security-lockfile-recovery
  cancel-in-progress: false
jobs:
  recover-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-platform-requirements
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate the lockfile with supported security patches
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm update baseline-browser-mapping brace-expansion browserslist js-yaml --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
      - name: Commit the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: regenerate patched security dependency lockfile"
          git push origin HEAD:feat/client-platform-requirements
