name: One-time delivery OTP transaction fixture fix

on:
  push:
    branches:
      - codex/complete-delivery-workflows

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complete-delivery-workflows
      - name: Repair accepted assignment fixture atomically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/delivery-otp-atomicity.integration.test.ts')
          text = path.read_text()
          old = '''    const order = await prisma.order.create({ data: { orderNumber: `OTP-${nonce}`, source: "CUSTOMER", deliveryType: "PARCEL_DOCUMENT", status: "IN_TRANSIT", recipientName: "Unregistered receiver", recipientEmail: `otp-receiver-${nonce}@example.test` } }); orderId = order.id;
    const assignment = await prisma.orderAssignment.create({ data: { orderId, driverProfileId: driverId, assignedByAdminId: adminId, assignedAt: new Date(), acceptedAt: new Date(), status: "ACCEPTED", activeOrderGuard: orderId } }); assignmentId = assignment.id;
    await prisma.order.update({ where: { id: orderId }, data: { currentDriverProfileId: driverId } });'''
          new = '''    const setup = await prisma.$transaction(async (tx) => {
      const order = await tx.order.create({ data: { orderNumber: `OTP-${nonce}`, source: "CUSTOMER", deliveryType: "PARCEL_DOCUMENT", status: "IN_TRANSIT", recipientName: "Unregistered receiver", recipientEmail: `otp-receiver-${nonce}@example.test` } });
      const assignment = await tx.orderAssignment.create({ data: { orderId: order.id, driverProfileId: driverId, assignedByAdminId: adminId, assignedAt: new Date(), acceptedAt: new Date(), status: "ACCEPTED", activeOrderGuard: order.id } });
      await tx.order.update({ where: { id: order.id }, data: { currentDriverProfileId: driverId } });
      return { order, assignment };
    });
    orderId = setup.order.id;
    assignmentId = setup.assignment.id;'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one OTP fixture setup block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/one-time-delivery-otp-transaction-fix.yml
          git diff --check
          git diff -- tests/integration/delivery-otp-atomicity.integration.test.ts
      - name: Commit guarded fixture repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/delivery-otp-atomicity.integration.test.ts .github/workflows/one-time-delivery-otp-transaction-fix.yml
          git commit -m 'Fix delivery OTP accepted-assignment fixture transaction'
          git push origin HEAD:codex/complete-delivery-workflows
