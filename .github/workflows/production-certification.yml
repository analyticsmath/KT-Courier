name: Production Certification
on:
  workflow_dispatch:
  push:
    tags: ['release-*']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/production-certification.yml', 'docs/production-closure/**', 'lib/production-readiness/**', 'scripts/disposable-closure-tests.mjs']
permissions:
  contents: read
concurrency:
  group: production-certification-${{ github.ref }}
  cancel-in-progress: true
env:
  KT_NETWORK_DISABLED: 'true'
  EMAIL_PROVIDER: console
  PAYSTACK_ACTIVE: 'false'
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://disposable:disposable_only@localhost:5432/kt_launch_test?schema=public
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run migrations:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: node --test scripts/certification-output.test.mjs scripts/e2e-ingress.test.mjs
      - run: node scripts/certification-command.mjs test:coverage
      - run: node scripts/certification-command.mjs test:payments
      - run: node scripts/certification-command.mjs test:refunds
      - run: node scripts/certification-command.mjs test:security:bola
      - run: node scripts/certification-command.mjs test:processors
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: certification-quality, path: 'output/production-closure'}
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: disposable
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: kt_launch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U disposable -d kt_launch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        command: [docker:migration-smoke, test:integration:auth, test:integration:permissions, test:integration:orders, test:integration:pricing, test:integration:dispatch, test:integration:cross-module, test:integration:driver-operations, test:integration:ledger, test:integration:payment-foundation, test:integration:refunds, test:integration:withdrawals, test:integration:store-earnings, test:integration:driver-earnings, test:integration:marketplace-checkout, test:integration:store-orders, test:integration:storefront, test:integration:catalog, test:integration:closure, docker:gate4]
    env:
      KT_RUNTIME_ENV: e2e
      KT_ALLOW_ISOLATED_POSTGRES_TESTS: '1'
      KT_WITHDRAWAL_INTEGRATION_APPROVED: 'true'
      KT_REFUND_INTEGRATION_APPROVED: 'true'
      KT_STORE_EARNING_INTEGRATION_APPROVED: 'true'
      KT_DRIVER_EARNING_INTEGRATION_APPROVED: 'true'
      KT_MARKETPLACE_CHECKOUT_INTEGRATION_APPROVED: 'true'
      KT_STORE_ORDER_INTEGRATION_APPROVED: 'true'
      KT_STOREFRONT_INTEGRATION_APPROVED: 'true'
      KT_CATALOG_INTEGRATION_APPROVED: 'true'
      KT_GATE4_INTEGRATION_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node scripts/certification-command.mjs ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'postgres-${{ strategy.job-index }}', path: 'output/production-closure'}
  redis-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/certification-command.mjs test:integration:redis-rate-limit
      - run: node scripts/certification-command.mjs test:integration:bola-authority
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: certification-redis-and-recovery, path: 'output/production-closure'}
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npm run recovery:drill
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: certification-recovery, path: 'output/production-closure'}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/certification-command.mjs test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failure-evidence, path: 'test-results'}
  certified:
    runs-on: ubuntu-latest
    needs: [quality, postgres, redis-and-recovery, recovery, browser]
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-closure-engineering-gates.mjs
      - run: echo 'Engineering gates passed for this commit. Separate production and live acceptance evidence is still required.'
