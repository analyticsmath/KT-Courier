name: One-time delivery certification fix

on:
  push:
    branches:
      - codex/complete-delivery-workflows

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complete-delivery-workflows
      - name: Apply guarded certification fixture fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          earning = Path('tests/integration/driver-earning-canonical-postgres.integration.test.ts')
          text = earning.read_text()
          old = 'approvedByUserId: reviewer.id, rules:'
          new = 'approvedByUserId: reviewer.id, createdByUserId: reviewer.id, rules:'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one CommissionPlan fixture target, found {text.count(old)}')
          earning.write_text(text.replace(old, new, 1))

          otp = Path('tests/integration/delivery-otp-atomicity.integration.test.ts')
          text = otp.read_text()
          old_order = 'recipientEmail: `otp-receiver-${nonce}@example.test`, currentDriverProfileId: driverId } }); orderId = order.id;'
          new_order = 'recipientEmail: `otp-receiver-${nonce}@example.test` } }); orderId = order.id;'
          if text.count(old_order) != 1:
              raise SystemExit(f'Expected one OTP order fixture target, found {text.count(old_order)}')
          text = text.replace(old_order, new_order, 1)

          old_assignment = 'const assignment = await prisma.orderAssignment.create({ data: { orderId, driverProfileId: driverId, assignedByAdminId: adminId, assignedAt: new Date(), acceptedAt: new Date(), status: "ACCEPTED", activeOrderGuard: orderId } }); assignmentId = assignment.id;'
          new_assignment = old_assignment + '\n    await prisma.order.update({ where: { id: orderId }, data: { currentDriverProfileId: driverId } });'
          if text.count(old_assignment) != 1:
              raise SystemExit(f'Expected one OTP assignment fixture target, found {text.count(old_assignment)}')
          text = text.replace(old_assignment, new_assignment, 1)

          old_cleanup = 'await prisma.orderAssignment.deleteMany({ where: { id: assignmentId } });'
          new_cleanup = 'await prisma.order.updateMany({ where: { id: orderId }, data: { currentDriverProfileId: null } });\n    ' + old_cleanup
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'Expected one OTP cleanup target, found {text.count(old_cleanup)}')
          otp.write_text(text.replace(old_cleanup, new_cleanup, 1))
          PY

          rm .github/workflows/one-time-delivery-certification-fix.yml
          git diff --check
          git diff -- tests/integration/driver-earning-canonical-postgres.integration.test.ts tests/integration/delivery-otp-atomicity.integration.test.ts
      - name: Commit guarded fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/driver-earning-canonical-postgres.integration.test.ts tests/integration/delivery-otp-atomicity.integration.test.ts .github/workflows/one-time-delivery-certification-fix.yml
          git commit -m 'Fix delivery workflow certification fixtures'
          git push origin HEAD:codex/complete-delivery-workflows
