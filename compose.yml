name: kt-couriers

x-db-url: &container_database_url postgresql://${POSTGRES_USER:-kt_courier}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-kt_courier_dev}?schema=public
x-shadow-db-url: &container_shadow_database_url postgresql://${POSTGRES_USER:-kt_courier}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${SHADOW_POSTGRES_DB:-kt_courier_shadow}?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kt_courier_dev}
      POSTGRES_USER: ${POSTGRES_USER:-kt_courier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      SHADOW_POSTGRES_DB: ${SHADOW_POSTGRES_DB:-kt_courier_shadow}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - kt_couriers_postgres_baselined_clean:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - kt_couriers_internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: *container_database_url
      SHADOW_DATABASE_URL: *container_shadow_database_url
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kt_couriers_internal

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: *container_database_url
      SHADOW_DATABASE_URL: *container_shadow_database_url
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - kt_couriers_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_E2E_DETERMINISTIC_COORDINATES: ${NEXT_PUBLIC_E2E_DETERMINISTIC_COORDINATES:-}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: *container_database_url
      SHADOW_DATABASE_URL: *container_shadow_database_url
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      E2E_ROUTE_PROVIDER: ${E2E_ROUTE_PROVIDER:-}
      NEXT_PUBLIC_E2E_DETERMINISTIC_COORDINATES: ${NEXT_PUBLIC_E2E_DETERMINISTIC_COORDINATES:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kt_couriers_internal

volumes:
  kt_couriers_postgres_baselined_clean:

networks:
  kt_couriers_internal:
    driver: bridge
